spring:
  application:
    name: producer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      repository:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}

# Logging configuration: keep root at INFO but enable DEBUG for producer package
logging:
  level:
    root: INFO
    com.mani.producer: DEBUG

outbox:
  cleanup:
    cron: "0 0 2 * * *" # Cleanup every day at 2 AM
    retention-days: 7 # Retain outbox messages for 7 days
    batch-size: 100 # Number of messages to delete in one batch


management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

  metrics:
    tags:
      application: producer