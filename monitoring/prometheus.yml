global:
  scrape_interval: 5s

scrape_configs:
  - job_name: producer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "host.docker.internal:8080" ]

  - job_name: consumer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "host.docker.internal:8082" ]

  - job_name: kafka-exporter
    static_configs:
      - targets: [ "kafka-exporter:9308" ]